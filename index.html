<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="description" content="Rudamoon AI — personal Gmail assistant">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet">
  <title>Rudamoon AI</title>

  <style>
    :root {
      --bg: #08111f;
      --panel: #0d1a2b;
      --text: #f8fafc;
      --muted: #9fb0c4;
      --accent: #19c37d;
      --accent2: #10a86c;
      --border: rgba(255,255,255,.08);
      --chat--color-primary: #19c37d;
      --chat--color-primary-shade-50: #10a86c;
      --chat--color-primary-shade-100: #0b8d5a;
      --chat--color-secondary: #08111f;
      --chat--color-dark: #08111f;
      --chat--window--width: 100%;
      --chat--window--height: 100%;
      --chat--header--background: #08111f;
      --chat--header--color: #fff;
      --chat--message--font-size: 15px;
    }

    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--bg); }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--text); }

    .app-header {
      height: 76px;
      display:flex;
      align-items:center;
      gap:12px;
      padding: 0 20px;
      border-bottom:1px solid var(--border);
      background:rgba(8,17,31,.96);
      position:relative;
      z-index:20;
    }
    .logo {
      width:42px; height:42px; border-radius:13px;
      display:grid; place-items:center;
      background:linear-gradient(135deg,#19c37d,#0b8d5a);
      box-shadow:0 8px 24px rgba(25,195,125,.22);
      color:white; font-size:21px; font-weight:800;
    }
    .title { font-size:18px; font-weight:750; line-height:1.1; }
    .subtitle { color:var(--muted); font-size:12px; margin-top:4px; }
    .status {
      margin-left:auto; display:flex; align-items:center; gap:7px;
      color:#b9c7d6; font-size:12px;
    }
    .dot { width:8px; height:8px; border-radius:50%; background:#19c37d; box-shadow:0 0 10px #19c37d; }

    .welcome {
      position:absolute; left:50%; top:50%;
      transform:translate(-50%,-50%);
      width:min(680px, calc(100% - 36px));
      text-align:center; pointer-events:none; z-index:1;
    }
    .welcome h1 { margin:0 0 10px; font-size:clamp(27px,5vw,42px); }
    .welcome p { margin:0; color:var(--muted); font-size:15px; }
    .chips { margin-top:22px; display:flex; flex-wrap:wrap; justify-content:center; gap:9px; }
    .chip {
      background:#102237; border:1px solid var(--border); color:#d8e2ed;
      padding:9px 13px; border-radius:999px; font-size:12px;
    }

    #n8n-chat { height:calc(100vh - 76px); position:relative; z-index:2; }
    #n8n-chat .chat-window { box-shadow:none !important; border-radius:0 !important; }
    #n8n-chat .chat-layout { min-height:100% !important; height:100% !important; }

    @media (max-width:600px) {
      .app-header { height:68px; padding:0 14px; }
      .logo { width:38px; height:38px; border-radius:11px; }
      .title { font-size:16px; }
      .status { display:none; }
      #n8n-chat { height:calc(100vh - 68px); }
      .welcome { top:42%; }
      .welcome h1 { font-size:29px; }
      .chips { gap:7px; }
      .chip { font-size:11px; padding:8px 10px; }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="logo">✦</div>
    <div>
      <div class="title">Rudamoon AI</div>
      <div class="subtitle">Your personal Gmail assistant</div>
    </div>
    <div class="status"><span class="dot"></span> Online</div>
  </header>

  <section class="welcome" aria-hidden="true">
    <h1>Ask your Gmail anything.</h1>
    <p>Find important emails, unread messages, senders, summaries and actions.</p>
    <div class="chips">
      <span class="chip">📧 Important emails</span>
      <span class="chip">🔎 Search Gmail</span>
      <span class="chip">📝 Summarize emails</span>
    </div>
  </section>

  <main id="n8n-chat"></main>

  <script type="module">
    import { createChat } from "https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js";

    createChat({
      webhookUrl: "https://rudamoon.app.n8n.cloud/webhook/71c468d3-7373-40ee-8037-b7c149ce050e/chat",
      target: "#n8n-chat",
      mode: "fullscreen",
      chatInputKey: "chatInput",
      chatSessionKey: "sessionId",
      loadPreviousSession: true,
      showWelcomeScreen: false,
      defaultLanguage: "en",
      initialMessages: [
        "Assalamualaikum! 👋",
        "I'm Rudamoon AI. Ask me anything about your Gmail."
      ],
      i18n: {
        en: {
          title: "Rudamoon AI",
          subtitle: "Gmail Assistant",
          footer: "",
          getStarted: "New conversation",
          inputPlaceholder: "Ask about your Gmail..."
        }
      },
      enableStreaming: true
    });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
    }
  </script>
</body>
</html>
